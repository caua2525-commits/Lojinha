<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lojinha">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Minha Lojinha</title>
<style>
:root{--bg:#eef3f0;--card:#fff;--ink:#14231c;--mut:#5b6b63;--line:#d5e0da;--br:#0f7b4f;--bri:#fff;--wn:#b8341f;--wb:#fbe7e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a15;--card:#17261f;--ink:#e8f1ec;--mut:#93a89d;--line:#27382f;--br:#3dbe85;--bri:#08140e;--wn:#ff8a75;--wb:#3a1e19;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main{max-width:640px;margin:0 auto;padding-left:16px;padding-right:16px}
header{padding-top:18px}
main{padding-top:8px;padding-bottom:100px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
h2{font-size:16px;margin:20px 0 0}
.mut{color:var(--mut);font-size:13px}
.em{grid-column:1/-1}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
#busca{margin:8px 0 4px}
.tot{background:var(--br);color:var(--bri);border-radius:16px;padding:16px 18px;margin:8px 0 14px;display:flex;flex-direction:column;gap:2px}
.tot b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.sell{background:none;border:0;text-align:left;padding:12px 12px 6px;display:flex;flex-direction:column;gap:2px;flex:1;transition:transform .08s}
.sell:active:not(:disabled){transform:scale(.97)}
.sell:disabled{opacity:.55;cursor:not-allowed}
.nm{font-weight:650}
.st{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.st.low{color:var(--wn)}
.ft{padding:0 12px 10px;min-height:32px;display:flex;align-items:center}
.badge{background:var(--br);color:var(--bri);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:650}
.card,.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.add,#cash,#cart{display:flex;flex-direction:column;gap:8px}
#cart{border-color:var(--br)}
.two,.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pri,.sec{border-radius:10px;padding:12px;font-weight:650;border:1px solid var(--line)}
.pri{background:var(--br);color:var(--bri);border-color:var(--br)}
.sec{background:var(--bg)}
.wa{width:100%;margin-top:14px}
#inst{margin-top:8px}
.rh{display:flex;gap:8px;align-items:center;margin-bottom:6px;justify-content:space-between}
.nmi{font-weight:650;flex:1}
.del{background:none;border:0;color:var(--wn);font-size:13px;padding:4px 0;white-space:nowrap}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.step{display:flex;gap:6px;align-items:center}
.step button{width:42px;height:40px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:20px}
.step input{text-align:center}
.ci{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ci .step button{width:34px;height:34px;font-size:18px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button,.chips button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--br);color:var(--bri);border-color:var(--br)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border-radius:99px;padding:4px 14px}
.troco{font-weight:700;min-height:22px}
.pl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
th,td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
.chip{background:var(--wb);color:var(--wn);border-radius:99px;padding:4px 10px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:10px 4px;border-radius:10px;color:var(--mut);font-weight:600}
nav button[aria-current="page"]{color:var(--br);background:var(--bg)}
.chips button[aria-pressed="true"]{background:var(--br);color:var(--bri);border-color:var(--br)}
.srch{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0 4px}
.srch #busca{margin:0}
#cats{margin:6px 0 0}
#lock{margin-top:8px}
#pinrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
#scanbox{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column}
#vid{flex:1;width:100%;min-height:0;object-fit:cover}
.sb{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card)}
</style>
</head>
<body>
<header><h1 id="ttl">Minha Lojinha</h1><div class="mut" id="hoje"></div><div class="mut" id="msg" role="status"></div><button class="sec" id="inst" data-a="inst" hidden>Instalar app</button><button class="sec" id="lock" data-a="lock" hidden>Ver custo e lucro (PIN)</button><div id="pinrow" hidden><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="pri" data-a="unlock">Desbloquear</button></div></header>
<main>
<div class="srch"><input id="busca" type="search" placeholder="Buscar produto ou ler código" autocomplete="off"><button class="sec" data-a="scan" data-v="cart">Escanear</button></div><div class="chips" id="cats"></div>
<section id="v-vender"><div class="tot" id="tot"></div>
<div class="card" id="cart" hidden><b>Carrinho</b><div id="citems"></div>
<div class="seg"><button data-a="pay" data-v="din">Dinheiro</button><button data-a="pay" data-v="pix">Pix</button><button data-a="pay" data-v="car">Cartão</button><button data-a="pay" data-v="fia">Fiado</button></div>
<div id="cash"><label>Valor recebido (R$)<input id="rec" inputmode="decimal" placeholder="Em branco = valor exato"></label><div class="chips" id="quick"></div></div>
<div id="fia" class="add" hidden><label>Cliente<select id="cli"></select></label><input id="ncli" placeholder="Ou cadastre um novo cliente" autocomplete="off"></div>
<div class="troco" id="troco"></div>
<button class="pri" data-a="done" id="done">Registrar venda</button></div>
<div class="grid" id="grid"></div></section>
<section id="v-estoque" hidden>
<div class="card add"><b>Novo produto</b>
<input id="nn" placeholder="Nome (ex.: Coca-Cola 2L)" autocomplete="off">
<div class="two"><input id="np" inputmode="decimal" placeholder="Preço de venda (R$)"><input id="nc" inputmode="decimal" placeholder="Custo (R$)"></div>
<div class="two"><input id="nq" type="number" inputmode="numeric" min="0" placeholder="Quantidade"><input id="nm" type="number" inputmode="numeric" min="0" placeholder="Avisar com até (5)"></div>
<div class="two"><label>Categoria<input id="ncat" list="catl" autocomplete="off"></label><label>Validade<input id="nv" type="date"></label></div>
<div class="srch"><input id="nb" inputmode="numeric" placeholder="Código de barras"><button class="sec" data-a="scan" data-v="fill">Ler</button></div><datalist id="catl"></datalist>
<button class="pri" data-a="add">Adicionar produto</button></div>
<div id="lista"></div>
<div class="card add"><b>Registrar perda</b><label>Produto<select id="lp"></select></label>
<div class="two"><input id="lq" type="number" inputmode="numeric" min="1" placeholder="Quantidade"><select id="lw"><option>Vencido</option><option>Quebrado</option><option>Outro</option></select></div>
<button class="sec" data-a="loss">Registrar perda</button></div>
<div class="card add"><b>Loja</b><label>Nome da loja<input id="sn" placeholder="Minha Lojinha" autocomplete="off"></label>
<div id="pinset" class="add"><label>PIN para ver custo e lucro (4 a 6 números; vazio remove)<input id="sp" type="password" inputmode="numeric"></label><button class="sec" data-a="setpin">Salvar PIN</button><div class="mut">É um bloqueio simples contra olhares curiosos, não uma proteção forte.</div></div></div>
<div class="card add"><b>Backup</b><div class="mut">Os dados ficam salvos neste aparelho. Baixe um backup de vez em quando.</div>
<div class="two"><button class="sec" data-a="exp">Baixar backup</button><button class="sec" data-a="imp">Restaurar backup</button></div>
<input type="file" id="imp" accept="application/json,.json" hidden></div>
</section>
<section id="v-fiado" hidden><div id="fres"></div></section>
<section id="v-resumo" hidden>
<div class="two"><label>Período<select id="per"><option value="d">Dia</option><option value="s">7 dias até a data</option><option value="m">Mês da data</option></select></label><label>Data<input type="date" id="dt"></label></div>
<div id="res"></div></section>
</main>
<nav>
<button id="n-vender" data-a="tab" data-v="vender" aria-current="page">Vender</button>
<button id="n-estoque" data-a="tab" data-v="estoque">Estoque</button>
<button id="n-resumo" data-a="tab" data-v="resumo">Resumo</button>
<button id="n-fiado" data-a="tab" data-v="fiado">Fiado</button>
</nav>
<div id="scanbox" hidden><video id="vid" playsinline muted></video><div class="sb"><span id="scanmsg"></span><button class="pri" data-a="scanx">Fechar</button></div></div>
<script>
const KEY='lojinha_v3',$=s=>document.querySelector(s);
const DEF=()=>({products:[],sales:[],days:{},cfg:{},clients:[],led:[],loss:[]});
let S=DEF(),cart={},pay='din',day=new Date().toLocaleDateString('sv-SE'),armed=null,ip=null,unlocked=false,catF='',stream=null,scanT=null;
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const num=v=>{v=parseFloat(String(v).replace(',','.'));return v>=0?v:NaN};
const mn=p=>p.min??5,rd=v=>Math.round(v*100)/100,P=id=>S.products.find(x=>x.id===id);
const PL={din:'Dinheiro',pix:'Pix',car:'Cartão',fia:'Fiado'},hh=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('lojinha_v2')||'{}'))}catch(e){}
const priv=()=>!S.cfg.pin||unlocked,bal=id=>rd(S.led.filter(l=>l.cid===id).reduce((s,l)=>s+l.amt,0));
function msg(t){const m=$('#msg');m.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent='',5000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){msg('Não foi possível salvar neste navegador.')}}
const send=t=>window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
const cartTotal=()=>rd(Object.entries(cart).reduce((s,[id,q])=>s+(P(id)?P(id).price*q:0),0));

function addCart(id,d){
  const p=P(id);if(!p)return;const n=(cart[id]||0)+d;
  if(n>p.qty){msg('Estoque insuficiente.');return}
  if(n<=0)delete cart[id];else cart[id]=n;
  render();
}
function checkout(){
  const ids=Object.keys(cart).filter(P);if(!ids.length)return;
  const tot=cartTotal();let rec=tot;
  if(pay==='din'&&$('#rec').value.trim()){rec=num($('#rec').value);if(isNaN(rec)||rec<tot){msg('O valor recebido é menor que o total.');return}}
  let cid;
  if(pay==='fia'){const nn=$('#ncli').value.trim();if(nn){cid=uid();S.clients.push({id:cid,name:nn})}else cid=$('#cli').value;
    if(!cid){msg('Escolha ou cadastre o cliente do fiado.');return}}
  const items=ids.map(id=>{const p=P(id),q=cart[id];p.qty-=q;return{p:id,n:p.name,q,pr:p.price,c:p.cost||0}});
  const sid=uid();S.sales.push({id:sid,t:Date.now(),d:today(),pay,tot,rec,cid,items});if(cid)S.led.push({id:uid(),cid,t:Date.now(),d:today(),sid,amt:tot});
  const tr=pay==='din'?rd(rec-tot):0;
  cart={};$('#rec').value='';$('#ncli').value='';save();render();
  msg(tr>0?'Venda registrada. Troco: '+R(tr):'Venda registrada.');
}
function cancel(id){
  const s=S.sales.find(x=>x.id===id);if(!s)return;
  s.items.forEach(i=>{const p=P(i.p);if(p)p.qty+=i.q});
  S.sales=S.sales.filter(x=>x!==s);S.led=S.led.filter(l=>l.sid!==id);armed=null;save();render();msg('Venda cancelada e estoque devolvido.');
}
function add(){
  const n=$('#nn').value.trim(),pr=num($('#np').value),co=num($('#nc').value||0),qt=num($('#nq').value||0),mi=num($('#nm').value||5);
  if(!n||isNaN(pr)){msg('Informe o nome e o preço do produto.');return}
  S.products.push({id:uid(),name:n,price:pr,cost:co||0,qty:Math.round(qt)||0,min:isNaN(mi)?5:Math.round(mi),cat:$('#ncat').value.trim(),bar:$('#nb').value.trim(),exp:$('#nv').value});
  ['#nn','#np','#nc','#nq','#nm','#ncat','#nb','#nv'].forEach(s=>$(s).value='');save();render();msg('Produto adicionado.');
}
function range(){
  const p=$('#per').value,d=new Date(day+'T12:00:00'),out=[],f=x=>x.toLocaleDateString('sv-SE');
  if(p==='d')return [day];
  if(p==='m'){for(let i=1;i<=31;i++){const x=new Date(d.getFullYear(),d.getMonth(),i,12);if(x.getMonth()!==d.getMonth())break;out.push(f(x))}return out}
  for(let i=6;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);out.push(f(x))}
  return out;
}
function agg(ds=range()){
  const m={},pt={din:0,pix:0,car:0,fia:0,rec:0,old:0},get=(id,n)=>m[id]=m[id]||{n,q:0,r:0,c:0};
  ds.forEach(d=>Object.entries(S.days[d]||{}).forEach(([id,i])=>{const a=get(id,i.n);a.q+=i.q;a.r+=i.r;a.c+=i.c||0;pt.old+=i.r}));
  S.sales.filter(s=>ds.includes(s.d)).forEach(s=>{pt[s.pay]+=s.tot;s.items.forEach(i=>{const a=get(i.p,i.n);a.q+=i.q;a.r+=i.pr*i.q;a.c+=i.c*i.q})});
  S.led.filter(l=>l.amt<0&&ds.includes(l.d)).forEach(l=>{pt[l.m]+=-l.amt;pt.rec+=-l.amt});
  const lo={q:0,c:0};S.loss.filter(l=>ds.includes(l.d)).forEach(l=>{lo.q+=l.q;lo.c+=l.q*l.c});
  return{m,pt,lo};
}
const sum=m=>Object.values(m).reduce((s,i)=>({q:s.q+i.q,r:s.r+i.r,c:s.c+i.c}),{q:0,r:0,c:0});
function troco(){
  const v=num($('#rec').value),t=cartTotal(),has=$('#rec').value.trim();
  $('#troco').textContent=pay!=='din'||!has?'':(v>=t?'Troco: '+R(v-t):'O valor é menor que o total');
}
function renderCart(){
  const ids=Object.keys(cart).filter(P);$('#cart').hidden=!ids.length;
  $('#citems').innerHTML=ids.map(id=>`<div class="ci"><span>${esc(P(id).name)}</span><span class="step"><button data-a="cm" data-id="${id}" aria-label="Tirar 1">−</button><b>${cart[id]}</b><button data-a="cp" data-id="${id}" aria-label="Pôr 1">+</button></span><b>${R(P(id).price*cart[id])}</b></div>`).join('');
  $('#done').textContent='Registrar venda: '+R(cartTotal());
  $('#cash').hidden=pay!=='din';$('#fia').hidden=pay!=='fia';
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===pay));
  $('#quick').innerHTML=['Valor exato','20','50','100'].map(v=>`<button data-a="cash" data-v="${v}">${v==='Valor exato'?v:'R$ '+v}</button>`).join('');
  troco();
}
function renderRes(){
  const{m,pt,lo}=agg(),ex=S.products.filter(p=>p.exp&&p.qty>0).map(p=>({p,d:Math.round((new Date(p.exp+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5)})).filter(x=>x.d<=7).sort((a,b)=>a.d-b.d),rows=Object.entries(m).sort((a,b)=>b[1].r-a[1].r),T=sum(m),need=S.products.filter(p=>p.qty<=mn(p));
  const one=$('#per').value==='d',ss=one?S.sales.filter(s=>s.d===day).sort((a,b)=>b.t-a.t):[];
  $('#dt').value=day;
  $('#res').innerHTML=`<div class="tot"><span>Total vendido</span><b>${R(T.r)}</b><span>${T.q} ${T.q==1?'item':'itens'}${priv()&&T.c>0?`, lucro estimado ${R(T.r-T.c)}`:''}</span></div>`
  +`<div class="card"><b>Fechamento por forma de pagamento</b>${['din','pix','car','fia'].map(k=>`<div class="pl"><span>${PL[k]}${k==='din'?' (no caixa)':k==='fia'?' (a receber)':''}</span><b>${R(pt[k])}</b></div>`).join('')}${pt.old>0?`<div class="pl"><span>Sem forma registrada</span><b>${R(pt.old)}</b></div>`:''}${pt.rec>0?`<div class="mut">Inclui ${R(pt.rec)} recebidos de fiado.</div>`:''}</div>`
  +(rows.length?`<table><tr><th>Produto</th><th>Qtd</th><th>Total</th><th>Estoque</th></tr>${rows.map(([id,i])=>`<tr><td>${esc(i.n)}</td><td>${i.q}</td><td>${R(i.r)}</td><td>${P(id)?P(id).qty:'-'}</td></tr>`).join('')}</table><button class="pri wa" data-a="wa">Enviar resumo no WhatsApp</button>`:`<p class="mut">Nenhuma venda neste período.</p>`)
  +(ss.length?`<h2>Vendas do dia</h2>${ss.map(s=>`<div class="row"><div class="rh"><b class="nmi">${hh(s.t)}, ${PL[s.pay]}</b><b>${R(s.tot)}</b></div><div class="mut">${s.items.map(i=>`${i.q}x ${esc(i.n)}`).join(', ')}</div><button class="del" data-a="cancel" data-id="${s.id}">${armed===s.id?'Confirmar cancelamento':'Cancelar venda'}</button></div>`).join('')}`:'')
  +(lo.q>0?`<p class="mut">Perdas no período: ${lo.q} un${priv()?`, custo ${R(lo.c)}`:''}.</p>`:'')+`<h2>Validade</h2>`+(ex.length?`<div class="chips">${ex.map(x=>`<span class="chip">${esc(x.p.name)}: ${x.d<0?'vencido':x.d===0?'vence hoje':'vence em '+x.d+' d'}</span>`).join('')}</div>`:`<p class="mut">Nada vencendo nos próximos 7 dias.</p>`)+`<h2>Lista de compras</h2>`+(need.length?`<div class="chips">${need.map(p=>`<span class="chip">${esc(p.name)}: restam ${p.qty}</span>`).join('')}</div><button class="pri wa" data-a="buy">Enviar lista pelo WhatsApp</button>`:`<p class="mut">Nenhum produto abaixo do mínimo.</p>`);
}
function render(){
  const f=$('#busca').value.trim().toLowerCase(),L=S.products.filter(p=>p.name.toLowerCase().includes(f)&&(!catF||p.cat===catF)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')),T=sum(agg([today()]).m);
  $('#tot').innerHTML=`<span>Vendido hoje</span><b>${R(T.r)}</b><span>${T.q} ${T.q==1?'item':'itens'}${priv()&&T.c>0?`, lucro estimado ${R(T.r-T.c)}`:''}</span>`;
  $('#grid').innerHTML=L.map(p=>{const c=cart[p.id]||0;
    return `<div class="tile"><button class="sell" data-a="cp" data-id="${p.id}" ${p.qty<=0?'disabled':''}><span class="nm">${esc(p.name)}</span><span class="mut">${R(p.price)}</span><span class="st${p.qty<=mn(p)?' low':''}">${p.qty<=0?'Esgotado':p.qty+' em estoque'}</span></button><div class="ft">${c?`<span class="badge">${c} no carrinho</span>`:'<span class="mut">Toque para adicionar</span>'}</div></div>`}).join('')
    ||`<p class="mut em">${S.products.length?'Nenhum produto encontrado.':'Cadastre seus produtos na aba Estoque para começar a vender.'}</p>`;
  $('#lista').innerHTML=L.map(p=>`<div class="row"><div class="rh"><input class="nmi" value="${esc(p.name)}" data-f="name" data-id="${p.id}" aria-label="Nome"><button class="del" data-a="del" data-id="${p.id}">${armed===p.id?'Confirmar exclusão':'Excluir'}</button></div><div class="ctl"><label>Estoque<span class="step"><button data-a="dec" data-id="${p.id}" aria-label="Tirar 1">−</button><input type="number" inputmode="numeric" min="0" value="${p.qty}" data-f="qty" data-id="${p.id}"><button data-a="inc" data-id="${p.id}" aria-label="Repor 1">+</button></span></label><label>Avisar com até<input type="number" inputmode="numeric" min="0" value="${mn(p)}" data-f="min" data-id="${p.id}"></label><label>Preço de venda (R$)<input inputmode="decimal" value="${String(p.price).replace('.',',')}" data-f="price" data-id="${p.id}"></label>${priv()?`<label>Custo (R$)<input inputmode="decimal" value="${String(p.cost||0).replace('.',',')}" data-f="cost" data-id="${p.id}"></label>`:''}<label>Categoria<input list="catl" value="${esc(p.cat||'')}" data-f="cat" data-id="${p.id}"></label><label>Código de barras<input inputmode="numeric" value="${esc(p.bar||'')}" data-f="bar" data-id="${p.id}"></label><label>Validade<input type="date" value="${p.exp||''}" data-f="exp" data-id="${p.id}"></label></div></div>`).join('')
    ||`<p class="mut">${S.products.length?'Nenhum produto encontrado.':'Nenhum produto ainda.'}</p>`;
  renderCart();renderRes();renderFia();ui();
}
function ui(){
  const nm=S.cfg.name||'Minha Lojinha';$('#ttl').textContent=nm;document.title=nm;
  $('#lock').hidden=!S.cfg.pin;$('#lock').textContent=unlocked?'Bloquear custo e lucro':'Ver custo e lucro (PIN)';
  if(unlocked)$('#pinrow').hidden=true;
  $('#pinset').hidden=!priv();
  const cs=[...new Set(S.products.map(p=>p.cat).filter(Boolean))].sort();
  $('#cats').innerHTML=cs.length?['',...cs].map(c=>`<button data-a="cat" data-v="${esc(c)}" aria-pressed="${c===catF}">${c?esc(c):'Todas'}</button>`).join(''):'';
  $('#catl').innerHTML=cs.map(c=>`<option value="${esc(c)}">`).join('');
  const lv=$('#lp').value,cv=$('#cli').value;
  $('#lp').innerHTML=S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('#lp').value=lv;
  $('#cli').innerHTML='<option value="">Escolha o cliente</option>'+S.clients.map(c=>`<option value="${c.id}">${esc(c.name)} (${R(bal(c.id))})</option>`).join('');$('#cli').value=cv;
  $('#sn').value=S.cfg.name||'';
}
function renderFia(){
  const cl=S.clients.map(c=>({...c,b:bal(c.id)})).sort((a,b)=>b.b-a.b),tot=cl.reduce((s,c)=>s+c.b,0);
  $('#fres').innerHTML=`<div class="tot"><span>Total a receber</span><b>${R(tot)}</b></div>`+(cl.map(c=>`<div class="row"><div class="rh"><b class="nmi">${esc(c.name)}</b><b>${R(c.b)}</b></div>${c.b>0?`<div class="two"><input id="r-${c.id}" inputmode="decimal" placeholder="Valor (R$)"><select id="m-${c.id}"><option value="din">Dinheiro</option><option value="pix">Pix</option><option value="car">Cartão</option></select></div><button class="pri" data-a="rec" data-id="${c.id}">Receber pagamento</button>`:'<span class="mut">Sem dívida.</span>'}</div>`).join('')||`<p class="mut">Nenhum cliente ainda. Cadastre ao vender no fiado.</p>`);
}
async function scanStart(mode){
  if(!('BarcodeDetector' in window)){msg('Este navegador não lê código de barras pela câmera. Digite o código ou use um leitor.');return}
  try{
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#vid');v.srcObject=stream;await v.play();$('#scanbox').hidden=false;
    $('#scanmsg').textContent='Aponte a câmera para o código de barras';let last='',lt=0;
    scanT=setInterval(async()=>{
      try{const r=await det.detect(v);if(!r.length)return;const c=r[0].rawValue,n=Date.now();
        if(c===last&&n-lt<2000)return;last=c;lt=n;
        if(mode==='fill'){$('#nb').value=c;scanStop();return}
        const p=S.products.find(x=>x.bar===c);
        if(p){addCart(p.id,1);navigator.vibrate&&navigator.vibrate(60);$('#scanmsg').textContent='Lido: '+p.name}
        else $('#scanmsg').textContent='Código '+c+' não cadastrado'}catch(e){}
    },400);
  }catch(e){msg('Não consegui abrir a câmera. Confira a permissão.');scanStop()}
}
function scanStop(){clearInterval(scanT);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#scanbox').hidden=true}
function tab(v){
  armed=null;
  ['vender','estoque','resumo','fiado'].forEach(k=>{$('#v-'+k).hidden=k!==v;$('#n-'+k).setAttribute('aria-current',k===v?'page':'false')});
  $('.srch').hidden=$('#cats').hidden=v==='resumo'||v==='fiado';render();scrollTo(0,0);
}
function wa(){
  const{m,pt}=agg(),rows=Object.values(m).sort((a,b)=>b.r-a.r),T=sum(m);
  const lb=$('#per').selectedOptions[0].text+' ('+day.split('-').reverse().join('/')+')';
  send(`*Resumo da lojinha: ${lb}*\nTotal: ${R(T.r)}\nItens: ${T.q}\nDinheiro: ${R(pt.din)}\nPix: ${R(pt.pix)}\nCartão: ${R(pt.car)}\nFiado: ${R(pt.fia)}\n`+rows.map(i=>`- ${i.n}: ${i.q} un, ${R(i.r)}`).join('\n'));
}
function buy(){send('*Lista de compras*\n'+S.products.filter(p=>p.qty<=mn(p)).map(p=>`- ${p.name} (restam ${p.qty})`).join('\n'))}
function exp(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='lojinha-backup-'+today()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('Backup baixado.');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,p=P(id),v=b.dataset.v;
  if(a==='cp')addCart(id,1);
  else if(a==='cm')addCart(id,-1);
  else if(a==='pay'){pay=v;renderCart()}
  else if(a==='cash'){$('#rec').value=v==='Valor exato'?'':v;troco()}
  else if(a==='done')checkout();
  else if(a==='cancel'){if(armed===id)cancel(id);else{armed=id;renderRes()}}
  else if(a==='inc'&&p){p.qty++;save();render()}
  else if(a==='dec'&&p&&p.qty>0){p.qty--;save();render()}
  else if(a==='del'){if(armed===id){S.products=S.products.filter(x=>x.id!==id);delete cart[id];armed=null;save()}else armed=id;render()}
  else if(a==='add')add();
  else if(a==='tab')tab(v);
  else if(a==='cat'){catF=v;render()}
  else if(a==='scan')scanStart(v);
  else if(a==='scanx')scanStop();
  else if(a==='lock'){if(unlocked){unlocked=false;render()}else $('#pinrow').hidden=!$('#pinrow').hidden}
  else if(a==='unlock'){if($('#pin').value===S.cfg.pin){unlocked=true;$('#pin').value='';render()}else msg('PIN incorreto.')}
  else if(a==='setpin'){const x=$('#sp').value.trim();if(x&&!/^\d{4,6}$/.test(x)){msg('Use de 4 a 6 números.');return}S.cfg.pin=x;unlocked=true;$('#sp').value='';save();render();msg(x?'PIN definido.':'PIN removido.')}
  else if(a==='loss'){const q=Math.round(num($('#lq').value)),p2=P($('#lp').value);
    if(!p2||!(q>0)){msg('Escolha o produto e a quantidade.');return}
    const qq=Math.min(q,p2.qty);if(qq<=0){msg('Esse produto está sem estoque.');return}
    S.loss.push({id:uid(),t:Date.now(),d:today(),pid:p2.id,n:p2.name,q:qq,c:p2.cost||0,w:$('#lw').value});
    p2.qty-=qq;$('#lq').value='';save();render();msg('Perda registrada.')}
  else if(a==='rec'){const x=num($('#r-'+id).value),b0=bal(id);
    if(!(x>0)){msg('Informe o valor recebido.');return}
    S.led.push({id:uid(),cid:id,t:Date.now(),d:today(),amt:-Math.min(x,b0),m:$('#m-'+id).value});save();render();msg('Pagamento registrado.')}
  else if(a==='wa')wa();
  else if(a==='buy')buy();
  else if(a==='exp')exp();
  else if(a==='imp')$('#imp').click();
  else if(a==='inst'){if(ip)ip.prompt();b.hidden=true}
});
document.addEventListener('input',e=>{if(e.target.id==='busca')render();else if(e.target.id==='rec')troco()});
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset.f,p=P(t.dataset.id);
  if(f&&p){
    const v=num(t.value);
    if(f==='name'){if(t.value.trim())p.name=t.value.trim()}else if(f==='cat'||f==='bar'||f==='exp')p[f]=t.value.trim();
    else if(!isNaN(v))p[f]=(f==='qty'||f==='min')?Math.round(v):v;
    if(cart[p.id]>p.qty)cart[p.id]=p.qty;if(!cart[p.id])delete cart[p.id];
    save();render();
  }else if(t.id==='dt'){day=t.value||today();armed=null;renderRes()}
  else if(t.id==='per')renderRes();
  else if(t.id==='sn'){S.cfg.name=t.value.trim();save();ui()}
  else if(t.id==='imp'){
    const file=t.files[0];if(!file)return;
    file.text().then(x=>{const o=JSON.parse(x);if(!Array.isArray(o.products))throw 0;S=Object.assign(DEF(),o);cart={};save();render();msg('Backup restaurado.')})
      .catch(()=>msg('Arquivo de backup inválido.'));
    t.value='';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.id!=='busca')return;
  const c=e.target.value.trim(),p=c&&S.products.find(x=>x.bar===c);
  if(p){e.target.value='';addCart(p.id,1)}
});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=false});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
$('#hoje').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
$('#dt').max=today();
render();
</script>
</body>
</html>
