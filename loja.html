<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd21f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest-loja.webmanifest">
<link rel="apple-touch-icon" href="loja-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@500;700;800&display=swap">
<title>Loja Andrea</title>
<style>
:root{--bg:#ffd21f;--card:#fff;--ink:#10295a;--mut:#46567d;--line:#10295a;--btn:#10295a;--btni:#fff;--acc:#d8232a;--acci:#fff;--ok:#1b7a4a;--wn:#b3201f;--soft:#fff2b0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1d42;--card:#14295c;--ink:#fff3c4;--mut:#b9c3dc;--line:#3a5aa6;--btn:#ffd21f;--btni:#10295a;--acc:#ff6a5f;--acci:#1a0705;--ok:#5fd39a;--wn:#ff8a7e;--soft:#1d3877;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2{font-family:"Alfa Slab One",Georgia,serif;font-weight:400}
header,main{max-width:640px;margin:0 auto;padding-left:16px;padding-right:16px}
header{padding-top:22px}main{padding-top:6px;padding-bottom:130px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:34px;line-height:1}h2{margin:0 0 6px;font-size:22px;line-height:1.15}
.sub{font-weight:700;margin-top:8px}
#who{font-size:13px;font-weight:700;color:var(--mut);margin-top:2px}
.lnk{background:none;border:0;color:var(--ink);font-weight:800;text-decoration:underline;padding:6px 0}
.mut{color:var(--mut);font-size:13px;font-weight:600}.em{grid-column:1/-1}
button,input,select,textarea{font:inherit;color:inherit}button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;min-width:0}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 12px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
#tabs button{background:none;border:0;border-right:2px solid var(--line);padding:11px 6px;font-weight:800;font-size:14px}
#tabs button:last-child{border-right:0}
#tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btni)}
#tabs i{font-style:normal;background:var(--acc);color:var(--acci);border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut)}
.search input{padding-left:42px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 16px;font-weight:800}
.chips button[aria-pressed="true"]{background:var(--acc);color:var(--acci);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.timg{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--soft);border-bottom:2px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:center;font:400 46px "Alfa Slab One",serif;opacity:.35}
.tile.out .timg{opacity:.4;filter:grayscale(1)}
.info{padding:10px 12px 2px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:800;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.price{color:var(--acc);font-family:"Alfa Slab One",serif;display:flex;align-items:flex-start;line-height:1}
.rs{font-size:12px;margin:4px 3px 0 0}.pi{font-size:32px}.pc{font-size:14px;margin:4px 0 0 1px}
.st{font-size:12px;font-weight:800;color:var(--ok)}.st.low{color:var(--wn)}
.act{padding:6px 12px 12px}
.addb{width:100%;background:var(--btn);color:var(--btni);border:0;border-radius:10px;padding:11px;font-weight:800}
.addb:disabled{opacity:.4;cursor:not-allowed}
.stp{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:10px;padding:2px}
.stp button{width:38px;height:36px;border:0;border-radius:8px;background:var(--btn);color:var(--btni);font-size:20px;font-weight:800}
.stp b{font-size:17px}
.sk{height:270px;border:2px solid var(--line);border-radius:14px;background:linear-gradient(90deg,var(--card) 25%,var(--soft) 50%,var(--card) 75%) 0 0/300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.card,.row{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.add{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pri,.sec{border-radius:12px;padding:12px;font-weight:800;border:2px solid var(--line)}
.pri{background:var(--acc);color:var(--acci);border-color:var(--acc)}.sec{background:var(--card)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--mut)}
.rh{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:6px}
.del{background:none;border:0;color:var(--wn);font-weight:800;font-size:13px;padding:6px 0}
.pill{border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800}
.s-novo{background:#ffe38a;color:#5a4000}.s-sep{background:#ffd0bd;color:#7a2a10}.s-pronto{background:#c5ecd3;color:#0f5a33}.s-ent{background:#dfe6f5;color:#27396b}.s-canc{background:#f6cfcb;color:#7d1a12}
textarea{width:100%;font:12px/1.3 ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px;resize:none}
.caderno{background:#fff repeating-linear-gradient(transparent 0 29px,#9fb8e6 29px 30px);border:2px solid var(--line);border-left:7px double #d8232a;border-radius:6px 14px 14px 6px;padding:16px 18px 18px 20px;color:#10295a;display:flex;flex-direction:column;gap:2px}
.caderno .mut{color:#46567d}.caderno .big{font:400 42px/1.1 "Alfa Slab One",serif;color:#d8232a}
#scrim{position:fixed;inset:0;background:rgba(10,20,45,.55);z-index:18}
#cart{position:fixed;left:0;right:0;bottom:0;z-index:19;max-width:640px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px;transform:translateY(110%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
#cart.open{transform:none;visibility:visible;transition:transform .25s ease}
.sh{display:flex;justify-content:space-between;align-items:center;font:400 22px "Alfa Slab One",serif}
.x{background:var(--soft);border:0;border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1}
.ci{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line)}
.step{display:flex;gap:6px;align-items:center}
.step button{width:34px;height:34px;background:var(--btn);color:var(--btni);border:0;border-radius:9px;font-size:18px;font-weight:800}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;max-width:616px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--acc);color:var(--acci);border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:15px}
#bar b{font:400 20px "Alfa Slab One",serif}
#bar .go{background:var(--acci);color:var(--acc);border-radius:10px;padding:7px 14px}
#msg:not(:empty){position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;max-width:616px;margin:0 auto;background:var(--btn);color:var(--btni);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700}
footer{text-align:center;padding-top:28px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.closed{background:var(--soft);border-style:dashed;font-weight:700}
header,main{max-width:960px;padding-left:12px;padding-right:12px}
header{padding-top:14px}
h1{font-size:28px}.sub{font-size:13px;margin-top:4px}
#tabs{margin:10px 0 8px}#tabs button{padding:9px 6px;font-size:13px}
.search input{padding-top:9px;padding-bottom:9px}
.srow{display:flex;gap:8px;align-items:center}.srow .search{flex:1}
.vt{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.vt button{background:none;border:0;padding:0 10px;height:42px;color:var(--ink);display:flex;align-items:center}
.vt svg{width:20px;height:20px}
.vt button[aria-pressed="true"]{background:var(--btn);color:var(--btni)}
.chips{padding:8px 0 4px}.chips button{padding:5px 14px;font-size:14px}
.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:4px}
.tile{border-radius:12px}
.info{padding:6px 8px 0;gap:2px}
.nm{font-size:13px}
.rs{font-size:10px;margin-top:3px}.pi{font-size:23px}.pc{font-size:11px;margin-top:3px}
.st{font-size:11px}
.act{padding:5px 8px 8px}
.addb{padding:8px 4px;font-size:13px}
.stp button{width:30px;height:30px;font-size:18px}.stp b{font-size:15px}
.ph{font-size:34px}.sk{height:150px}
.grid.list{grid-template-columns:1fr}
.grid.list .tile{flex-direction:row;align-items:center}
.grid.list .timg{width:72px;height:72px;flex:none;aspect-ratio:auto;border-bottom:0;border-right:2px solid var(--line)}
.grid.list .info{flex:1;padding:8px 10px;min-width:0}
.grid.list .act{width:116px;flex:none;padding:8px 10px 8px 0}
.codigo{display:flex;flex-direction:column;align-items:center;gap:2px;margin:8px 0;padding:10px;border:2px dashed var(--line);border-radius:12px;background:var(--soft)}
.codigo b{font:400 40px/1 "Alfa Slab One",serif;letter-spacing:6px;color:var(--ink)}
.codigo span,.codigo small{font-size:12px;font-weight:800;color:var(--mut)}
</style>
</head>
<body>
<header>
<div class="hrow"><div><h1 id="ttl">Loja Andrea</h1><div class="sub">Faça seu pedido e a gente separa para você.</div><div id="who"></div></div><button class="lnk" id="outb" data-a="out" hidden>Sair</button></div>
<div class="mut" id="msg" role="status"></div>
<button class="sec" id="inst" data-a="inst" hidden style="margin-top:10px">Instalar app</button>
</header>
<main>
<section id="auth" class="card add"><h2>Entre para pedir</h2>
<p class="mut" style="margin:0">Na primeira vez, informe seu nome e toque em Criar conta.</p>
<input id="nm" placeholder="Seu nome (só para criar a conta)" autocomplete="name">
<input id="em" type="email" placeholder="E-mail" autocomplete="email">
<input id="pw" type="password" placeholder="Senha (6 ou mais caracteres)" autocomplete="current-password">
<div class="two"><button class="pri" data-a="login">Entrar</button><button class="sec" data-a="signup">Criar conta</button></div></section>
<section id="app" hidden>
<nav id="tabs"><button data-a="t" data-v="loja" aria-pressed="true">Loja</button><button data-a="t" data-v="ped" aria-pressed="false">Meus pedidos<i id="pn" hidden></i></button><button data-a="t" data-v="fia" aria-pressed="false">Fiado</button></nav>
<div id="sec-loja">
<div class="card closed" id="closed" hidden></div>
<div class="srow"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="busca" type="search" placeholder="Buscar produto" autocomplete="off"></div><div class="vt"><button data-a="view" data-v="grade" aria-label="Ver em grade" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button><button data-a="view" data-v="lista" aria-label="Ver em lista" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="4" rx="1.5"/><rect x="3" y="10" width="18" height="4" rx="1.5"/><rect x="3" y="16" width="18" height="4" rx="1.5"/></svg></button></div></div>
<div class="chips" id="cats"></div>
<div class="grid" id="grid"></div>
</div>
<div id="sec-ped" hidden><div id="olist"></div></div>
<div id="sec-fia" hidden><div id="fiado"></div></div>
</section>
<footer class="mut">Versão do app: 13</footer>
</main>
<div id="scrim" data-a="sheet" hidden></div>
<div id="cart" role="dialog" aria-label="Seu pedido"><div class="sh"><span>Seu pedido</span><button class="x" data-a="sheet" aria-label="Fechar">×</button></div><div id="citems"></div>
<label>Pagamento<select id="pay"><option value="pix">Pix</option><option value="fia" id="ofia">Fiado</option></select></label>
<div class="mut" id="pixnote">Depois de enviar o pedido, o código Pix aparece em Meus pedidos.</div>
<button class="pri" data-a="order">Fazer pedido: <span id="ctot"></span></button></div>
<button id="bar" data-a="sheet" hidden><span id="bn"></span><b id="bt"></b><span class="go">Ver pedido</span></button>
<script type="module" onerror="document.getElementById('msg').textContent='Não consegui carregar o Firebase. Confira a internet e tente de novo.'">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,updateDoc,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAR7RtHesHauHTugXU6YMHA1j3dpVrxXYw",authDomain:"loja-andrea.firebaseapp.com",projectId:"loja-andrea",storageBucket:"loja-andrea.firebasestorage.app",messagingSenderId:"174611699950",appId:"1:174611699950:web:a7d93ea5e8d0e4effa3bff"});
const auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={novo:'Aguardando a loja',sep:'Separado para você',pronto:'Pronto para retirar',ent:'Entregue',canc:'Cancelado'};
let me=null,cust={},cfg={},prods=[],orders=[],cart={},unsubs=[],healing=false,ip=null,catF='',sheet=false,tab='loja',loaded=false,view=(()=>{try{return localStorage.getItem('lv')||'grade'}catch(e){return 'grade'}})();
const P=id=>prods.find(p=>p.id===id);
function msg(t){const m=$('#msg');m.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent='',6000)}
const erro=e=>msg(({'auth/invalid-credential':'E-mail ou senha incorretos.','auth/email-already-in-use':'Esse e-mail já tem conta. Toque em Entrar.','auth/weak-password':'A senha precisa ter 6 ou mais caracteres.','auth/configuration-not-found':'O login por e-mail ainda não foi ativado no Firebase.','auth/operation-not-allowed':'O login por e-mail e senha não está ativado no Firebase.','auth/network-request-failed':'Sem conexão com a internet.','auth/too-many-requests':'Muitas tentativas. Espere um pouco e tente de novo.','auth/invalid-email':'E-mail inválido.','permission-denied':'Sem permissão para essa ação.'})[e.code]||'Erro: '+(e.code||e.message));
const asc=(s,n)=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().slice(0,n);
const tl=(i,v)=>i+String(v.length).padStart(2,'0')+v;
function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const cpfOk=d=>{if(d.length!==11||/^(\d)\1+$/.test(d))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=d[i]*(t+1-i);if((s*10%11)%10!=d[t])return false}return true};
function pixKey(k){
  k=String(k||'').trim();if(k.includes('@'))return k.toLowerCase();
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k))return k.toLowerCase();
  const d=k.replace(/\D/g,'');
  if(k[0]==='+')return '+'+d;
  if(d.length===13&&d.startsWith('55'))return '+'+d;
  if(d.length===11)return cpfOk(d)?d:'+55'+d;
  if(d.length===10)return '+55'+d;
  return d.length>=11&&/^[\d.\/-]+$/.test(k)?d:k;
}
function pixCode(o){
  const p='000201010211'+tl('26',tl('00','br.gov.bcb.pix')+tl('01',pixKey(cfg.pix)))+'52040000'+'5303986'+tl('54',(+o.total).toFixed(2))+'5802BR'+tl('59',asc(cfg.nome||'LOJA',25))+tl('60',asc(cfg.cidade||'BRASIL',15))+tl('62',tl('05',String(o.id).replace(/[^A-Za-z0-9]/g,'').slice(0,20)||'***'))+'6304';
  return p+crc(p);
}
const hm=()=>{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()),g=t=>+p.find(x=>x.type===t).value;return (g('hour')%24)*60+g('minute')};
const mins=s=>{const [h,m]=String(s||'0:0').split(':');return +h*60+(+m||0)};
const aberta=c=>{if(c.open===false)return false;if(!c.auto)return true;const n=hm(),a=mins(c.from||'07:00'),f=mins(c.to||'23:00');return a<=f?(n>=a&&n<f):(n>=a||n<f)};
const PR=v=>{const [i,c]=(+v||0).toFixed(2).split('.');return `<span class="price" aria-label="${R(v)}"><span class="rs">R$</span><span class="pi">${(+i).toLocaleString('pt-BR')}</span><span class="pc">,${c}</span></span>`};
function ocard(o){
  const pix=o.pay==='pix'&&!o.paid&&o.st!=='canc';
  return `<div class="row"><div class="rh"><span class="pill s-${o.st}">${ST[o.st]||o.st}</span><b>${R(o.total)}</b></div><div class="mut">${new Date(o.t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}: ${(o.items||[]).map(i=>`${i.q}x ${esc(i.n)}`).join(', ')}</div><div class="mut">${o.pay==='pix'?(o.paid?'Pix confirmado pela loja':'Pagamento: Pix'):'Pagamento: fiado'}</div>${o.code&&['novo','sep','pronto'].includes(o.st)?`<div class="codigo"><span>Código de retirada</span><b>${o.code}</b><small>Diga este número ao retirar. Não compartilhe com ninguém.</small></div>`:''}`
  +(pix?(cfg.pix?`<div class="mut">Pague ${R(o.total)} por Pix: copie o código abaixo e cole no app do seu banco, em Pix Copia e Cola. A loja confirma quando o pagamento chegar.</div><textarea readonly rows="4" id="pc-${o.id}" onfocus="this.select()">${pixCode(o)}</textarea><button class="pri" data-a="pix" data-id="${o.id}">Copiar código Pix</button>`:'<div class="mut">A loja ainda não cadastrou a chave Pix. Fale com a loja.</div>'):'')
  +(o.st==='novo'&&cfg.wa?`<button class="sec" data-a="zap" data-id="${o.id}">Avisar a loja no WhatsApp</button>`:'')
  +(o.st==='novo'?`<button class="del" data-a="ocanc" data-id="${o.id}">Cancelar pedido</button>`:'')+`</div>`;
}
function render(){
  const open=aberta(cfg);
  $('#grid').classList.toggle('list',view==='lista');document.querySelectorAll('.vt button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  const cs=[...new Set(prods.map(p=>p.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));if(catF&&!cs.includes(catF))catF='';
  $('#cats').innerHTML=cs.length?['',...cs].map(c=>`<button data-a="cat" data-v="${esc(c)}" aria-pressed="${c===catF}">${c?esc(c):'Todas'}</button>`).join(''):'';
  $('#pixnote').hidden=$('#pay').value!=='pix';
  const cl=$('#closed');cl.hidden=open;if(!open)cl.textContent=cfg.open===false?'A loja não está recebendo pedidos agora. Volte mais tarde.':'Estamos fechados agora. Abrimos às '+(cfg.from||'07:00')+'.';
  const f=$('#busca').value.trim().toLowerCase(),ids=Object.keys(cart).filter(P),tot=ids.reduce((s,id)=>s+P(id).price*cart[id],0);
  $('#grid').innerHTML=!loaded?'<div class="sk"></div>'.repeat(4):(prods.filter(p=>p.name.toLowerCase().includes(f)&&(!catF||p.cat===catF)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(p=>{const c=cart[p.id]||0;
    return `<div class="tile${p.qty<=0?' out':''}">${p.img?`<img class="timg" src="${p.img}" alt="${esc(p.name)}">`:`<div class="timg ph">${esc(p.name.slice(0,1).toUpperCase())}</div>`}<div class="info"><span class="nm">${esc(p.name)}</span>${PR(p.price)}${p.qty<=3?`<span class="st low">${p.qty<=0?'Esgotado':'Últimas '+p.qty}</span>`:''}</div><div class="act">${!open?'<button class="addb" disabled>Fechado agora</button>':p.qty<=0?'<button class="addb" disabled>Esgotado</button>':c?`<div class="stp"><button data-a="cm" data-id="${p.id}" aria-label="Tirar 1">−</button><b>${c}</b><button data-a="add" data-id="${p.id}" aria-label="Pôr 1">+</button></div>`:`<button class="addb" data-a="add" data-id="${p.id}">Adicionar</button>`}</div></div>`}).join('')||`<p class="mut em">${prods.length?'Nenhum produto encontrado. Tente outro nome ou categoria.':'A loja ainda não publicou produtos. Volte daqui a pouco.'}</p>`);
  if(!ids.length||!open)sheet=false;
  $('#cart').classList.toggle('open',sheet);$('#scrim').hidden=!sheet;
  const nq=ids.reduce((s,id)=>s+cart[id],0);$('#bar').hidden=!ids.length||sheet||!open;$('#bn').textContent=nq+(nq==1?' item':' itens');$('#bt').textContent=R(tot);
  $('#citems').innerHTML=ids.map(id=>`<div class="ci"><span>${esc(P(id).name)}</span><span class="step"><button data-a="cm" data-id="${id}" aria-label="Tirar 1">−</button><b>${cart[id]}</b><button data-a="add" data-id="${id}" aria-label="Pôr 1">+</button></span><b>${R(P(id).price*cart[id])}</b></div>`).join('');
  $('#ctot').textContent=R(tot);
  $('#ofia').hidden=$('#ofia').disabled=!cust.fiadoOk;if(!cust.fiadoOk)$('#pay').value='pix';
  $('#olist').innerHTML=orders.map(ocard).join('')||'<p class="mut">Você ainda não fez pedidos. Escolha produtos na aba Loja.</p>';
  $('#fiado').innerHTML=cust.fiadoOk?`<div class="caderno"><span class="mut">Caderninho do fiado</span><span class="big">${R(cust.balance||0)}</span><span class="mut">Limite de ${R(cust.limit||0)}. Ainda dá para pegar ${R(Math.max(0,(cust.limit||0)-(cust.balance||0)))}.</span></div>`:`<div class="card"><b>Fiado</b><p class="mut">O fiado ainda não foi liberado para você. Peça à loja se quiser comprar fiado.</p></div>`;
  const na=orders.filter(o=>['novo','sep','pronto'].includes(o.st)).length;$('#pn').hidden=!na;$('#pn').textContent=na;
  ['loja','ped','fia'].forEach(k=>$('#sec-'+k).hidden=tab!==k);document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===tab));
}
async function order(){
  if(!aberta(cfg)){msg('A loja está fechada agora.');return}
  const ids=Object.keys(cart).filter(P);if(!ids.length)return;
  const code=String(100+crypto.getRandomValues(new Uint32Array(1))[0]%900);
  const items=ids.map(id=>({p:id,n:P(id).name,q:cart[id],pr:P(id).price})),total=Math.round(items.reduce((s,i)=>s+i.pr*i.q,0)*100)/100,pay=$('#pay').value;
  if(pay==='fia'&&(cust.balance||0)+total>(cust.limit||0)){msg('Esse pedido passa do seu limite de fiado.');return}
  const ref=await addDoc(collection(db,'orders'),{uid:me.uid,name:cust.name||me.displayName||'Cliente',items,total,pay,st:'novo',paid:false,code,t:Date.now()});
  cart={};sheet=false;render();let ok=false;
  if(cfg.ntfy)fetch('https://ntfy.sh/'+encodeURIComponent(cfg.ntfy)+'/publish?title='+encodeURIComponent('Novo pedido')+'&priority=high&tags=shopping_cart&message='+encodeURIComponent(items.reduce((s,i)=>s+i.q,0)+' item(ns), '+R(total)+'. Abra o app para ver.'),{mode:'no-cors'}).catch(()=>{});
  if(pay==='pix'&&cfg.pix){try{await navigator.clipboard.writeText(pixCode({id:ref.id,total}));ok=true}catch(e){}}
  msg((ok?'Pedido enviado! Código Pix copiado: cole no app do seu banco. ':'Pedido enviado! ')+'Seu código de retirada: '+code+'. Guarde-o.');
  tab='ped';render();scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,o=orders.find(x=>x.id===id);
  try{
    if(a==='add'){const p=P(id);if(!p)return;const n=(cart[id]||0)+1;if(n>p.qty){msg('Só temos '+p.qty+' em estoque.');return}cart[id]=n;render()}
    else if(a==='cm'){cart[id]--;if(cart[id]<=0)delete cart[id];render()}
    else if(a==='order')await order();
    else if(a==='login'||a==='signup'){
      const nm=$('#nm').value.trim(),em=$('#em').value.trim(),pw=$('#pw').value;
      if(!em||!pw||(a==='signup'&&!nm)){msg(a==='signup'?'Preencha nome, e-mail e senha.':'Informe e-mail e senha.');return}
      if(a==='login')await signInWithEmailAndPassword(auth,em,pw);
      else{const cr=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(cr.user,{displayName:nm});
        await setDoc(doc(db,'customers',cr.user.uid),{name:nm,email:em,fiadoOk:false,limit:0,balance:0})}
    }
    else if(a==='out')await signOut(auth);
    else if(a==='pix'&&o){try{await navigator.clipboard.writeText(pixCode(o));msg('Código copiado. No app do banco, escolha Pix Copia e Cola.')}catch(e){const t=$('#pc-'+id);if(t){t.focus();t.select();try{document.execCommand('copy')}catch(x){}}msg('Se não copiou, segure o dedo no código e toque em Copiar.')}}
    else if(a==='cat'){catF=b.dataset.v;render()}
    else if(a==='sheet'){sheet=!sheet;render()}
    else if(a==='view'){view=b.dataset.v;try{localStorage.setItem('lv',view)}catch(e){}render()}
    else if(a==='t'){tab=b.dataset.v;render();scrollTo(0,0)}
    else if(a==='ocanc')await updateDoc(doc(db,'orders',id),{st:'canc'});
    else if(a==='zap'&&o){const w=String(cfg.wa).replace(/\D/g,'');window.open('https://wa.me/'+(w.length<=11?'55':'')+w+'?text='+encodeURIComponent('Fiz um pedido no app: '+(o.items||[]).map(i=>i.q+'x '+i.n).join(', ')+'. Total '+R(o.total)+'. Nome: '+o.name),'_blank')}
    else if(a==='inst'){if(ip)ip.prompt();b.hidden=true}
  }catch(er){erro(er)}
});
document.addEventListener('input',e=>{if(e.target.id==='busca')render()});
document.addEventListener('change',e=>{if(e.target.id==='pay')render()});
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];healing=false;me=u;cust={};orders=[];cart={};loaded=false;sheet=false;tab='loja';
  $('#auth').hidden=!!u;$('#app').hidden=!u;$('#outb').hidden=!u;$('#who').textContent=u?'Olá, '+String(u.displayName||u.email).split(/[ @]/)[0]:'';
  if(!u){render();return}
  unsubs=[
    onSnapshot(collection(db,'products'),s=>{loaded=true;prods=s.docs.map(d=>({id:d.id,...d.data()}));render()},erro),
    onSnapshot(doc(db,'customers',u.uid),s=>{cust=s.data()||{};
      if(!s.exists()&&!s.metadata.fromCache&&!healing){healing=true;setDoc(doc(db,'customers',u.uid),{name:u.displayName||String(u.email).split('@')[0],email:u.email,fiadoOk:false,limit:0,balance:0}).catch(()=>{healing=false})}
      render()},erro),
    onSnapshot(doc(db,'config','loja'),s=>{cfg=s.data()||{};$('#ttl').textContent=document.title=cfg.loja||'Loja Andrea';render()},erro),
    onSnapshot(query(collection(db,'orders'),where('uid','==',u.uid)),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);render()},erro)
  ];
});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=false});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('unhandledrejection',e=>erro(e.reason||{}));
setInterval(()=>{if(me)render()},60000);
render();
</script>
</body>
</html>
