<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd21f">
<link rel="manifest" href="manifest-loja.webmanifest">
<title>Monte seu açaí</title>
<style>
:root{--bg:#ffd21f;--card:#fff;--ink:#10295a;--mut:#46567d;--line:#10295a;--acc:#d8232a;--acci:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1d42;--card:#14295c;--ink:#fff3c4;--mut:#b9c3dc;--line:#3a5aa6;--acc:#ff6a5f;--acci:#1a0705;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
h1{margin:6px 0 2px;font-size:28px;line-height:1.1}
h2{margin:20px 0 4px;font-size:18px}
a{color:var(--ink);font-weight:800}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:13px;font-weight:600}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri,.sec{width:100%;margin-top:10px;border-radius:12px;padding:12px;font-weight:800;border:2px solid var(--line)}
.pri{background:var(--acc);color:var(--acci);border-color:var(--acc)}
.sec{background:var(--card)}
button:disabled{opacity:.4;cursor:not-allowed}
.base{display:flex;justify-content:space-between;gap:10px;width:100%;margin-top:8px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:800}
.base[aria-pressed="true"]{background:var(--acc);color:var(--acci);border-color:var(--acc)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line);font-weight:700}
.opt.off{opacity:.45}
.opt input{width:24px;height:24px;flex:none}
.cup{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.del{background:none;border:0;color:var(--acc);font-weight:800;padding:4px 0}
.pill{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800;background:#ffe38a;color:#5a4000}
.pill.pronto{background:#c5ecd3;color:#0f5a33}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
textarea{width:100%;margin-top:8px;font:12px/1.3 ui-monospace,Menlo,monospace;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;resize:none}
#msg:not(:empty){position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:9;max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<main>
<a href="loja.html">Voltar à loja</a>
<h1>Monte seu açaí</h1>
<div id="msg" role="status"></div>
<div id="out" class="card" hidden>Entre na sua conta pela <a href="loja.html">loja</a> e volte aqui para montar o açaí.</div>
<div id="app" hidden>
<h2>Escolha o açaí</h2>
<div id="bases"></div>
<div id="ingw" class="card" hidden><b>Escolha os ingredientes</b><div id="ings"></div><b id="cth" style="display:block;margin-top:16px" hidden>Escolha a cobertura</b><div id="cobs"></div><button class="pri" id="addc">Adicionar ao pedido</button></div>
<div id="cartw" class="card" hidden><b>Seu pedido</b><div id="cups"></div><button class="pri" id="go"></button><div class="mut" style="margin-top:8px">O pagamento é por Pix. O código aparece logo depois de enviar o pedido.</div></div>
<h2>Pedidos em andamento</h2>
<div id="orders"></div>
<button class="sec" id="nt" hidden>Ativar avisos neste celular</button>
</div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,addDoc,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAR7RtHesHauHTugXU6YMHA1j3dpVrxXYw",authDomain:"loja-andrea.firebaseapp.com",projectId:"loja-andrea",storageBucket:"loja-andrea.firebasestorage.app",messagingSenderId:"174611699950",appId:"1:174611699950:web:a7d93ea5e8d0e4effa3bff"});
const auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const ST={novo:'Aguardando a loja',sep:'Em preparo',pronto:'Pronto para retirar'};
let me=null,name='Cliente',cfg={},prods=[],orders=[],cups=[],base=null,pick=new Set(),prev=null,unsubs=[],told={};
try{told=JSON.parse(localStorage.getItem('told')||'{}')}catch(e){}
const P=id=>prods.find(p=>p.id===id),bases=()=>prods.filter(p=>nz(p.cat)==='acai'),ings=()=>prods.filter(p=>nz(p.cat)==='ingredientes').sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
const cobs=()=>prods.filter(p=>/^cobertura/.test(nz(p.cat))).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
const cupTot=c=>(P(c.b)?P(c.b).price:0)+c.i.reduce((s,id)=>s+(P(id)?P(id).price:0),0);
function msg(t){const m=$('#msg');m.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent='',6000)}
const erro=e=>msg(e.code==='permission-denied'?'Sem permissão para essa ação.':'Erro: '+(e.code||e.message));
const asc=(s,n)=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().slice(0,n);
const tl=(i,v)=>i+String(v.length).padStart(2,'0')+v;
function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const cpfOk=d=>{if(d.length!==11||/^(\d)\1+$/.test(d))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=d[i]*(t+1-i);if((s*10%11)%10!=d[t])return false}return true};
function pixKey(k){
  k=String(k||'').trim();if(k.includes('@'))return k.toLowerCase();
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k))return k.toLowerCase();
  const d=k.replace(/\D/g,'');
  if(k[0]==='+')return '+'+d;
  if(d.length===13&&d.startsWith('55'))return '+'+d;
  if(d.length===11)return cpfOk(d)?d:'+55'+d;
  if(d.length===10)return '+55'+d;
  return d.length>=11&&/^[\d.\/-]+$/.test(k)?d:k;
}
function pixCode(o){
  const p='000201010211'+tl('26',tl('00','br.gov.bcb.pix')+tl('01',pixKey(cfg.pix)))+'52040000'+'5303986'+tl('54',(+o.total).toFixed(2))+'5802BR'+tl('59',asc(cfg.nome||'LOJA',25))+tl('60',asc(cfg.cidade||'BRASIL',15))+tl('62',tl('05',String(o.id).replace(/[^A-Za-z0-9]/g,'').slice(0,20)||'***'))+'6304';
  return p+crc(p);
}
const hm=()=>{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()),g=t=>+p.find(x=>x.type===t).value;return (g('hour')%24)*60+g('minute')};
const mins=s=>{const [h,m]=String(s||'0:0').split(':');return +h*60+(+m||0)};
const aberta=c=>{if(c.open===false)return false;if(!c.auto)return true;const n=hm(),a=mins(c.from||'07:00'),f=mins(c.to||'23:00');return a<=f?(n>=a&&n<f):(n>=a||n<f)};
const ntfy=(t,m)=>{if(cfg.ntfy)fetch('https://ntfy.sh/'+encodeURIComponent(cfg.ntfy)+'/publish?title='+encodeURIComponent(t)+'&priority=high&tags=shopping_cart&message='+encodeURIComponent(m),{mode:'no-cors'}).catch(()=>{})};
function render(){
  const B=bases(),I=ings(),C=cobs();
  $('#bases').innerHTML=B.length?B.map(p=>`<button class="base" data-b="${p.id}" aria-pressed="${base===p.id}"${p.qty<=0?' disabled':''}><span>${esc(p.name)}</span><span>${p.qty<=0?'Esgotado':R(p.price)}</span></button>`).join(''):'<p class="mut">Os açaís ainda não foram cadastrados na loja.</p>';
  $('#ingw').hidden=!base;
  const opt=p=>`<label class="opt${p.qty<=0?' off':''}"><span>${esc(p.name)}<br><span class="mut">${p.qty<=0?'Esgotado':p.price>0?'Mais '+R(p.price):'Sem custo'}</span></span><input type="checkbox" data-i="${p.id}"${pick.has(p.id)?' checked':''}${p.qty<=0?' disabled':''}></label>`;
  $('#ings').innerHTML=I.map(opt).join('')||'<p class="mut">Nenhum ingrediente cadastrado ainda.</p>';
  $('#cobs').innerHTML=C.map(opt).join('');$('#cth').hidden=!C.length;
  const tot=cups.reduce((s,c)=>s+cupTot(c),0);
  $('#cartw').hidden=!cups.length;
  $('#cups').innerHTML=cups.map((c,k)=>`<div class="cup"><span><b>${esc(P(c.b)?P(c.b).name:'Açaí')}</b><br><span class="mut">${c.i.map(id=>esc(P(id)?P(id).name:'')).join(', ')||'Sem ingredientes'}</span></span><span><b>${R(cupTot(c))}</b><br><button class="del" data-r="${k}">Remover</button></span></div>`).join('');
  $('#go').textContent='Fazer pedido: '+R(tot);
  const ac=orders.filter(o=>ST[o.st]).sort((a,b)=>b.t-a.t);
  $('#orders').innerHTML=ac.map(o=>`<div class="card"><div class="rh"><span class="pill ${o.st}">${ST[o.st]}</span><b>${R(o.total)}</b></div><div class="mut">${(o.items||[]).map(i=>`${i.q}x ${esc(i.n)}`).join(', ')}</div>`
    +(o.pay==='pix'&&!o.paid?(cfg.pix?`<div class="mut" style="margin-top:8px">Pague ${R(o.total)} por Pix: copie o código e cole no app do banco, em Pix Copia e Cola.</div><textarea readonly rows="4" onfocus="this.select()">${pixCode(o)}</textarea><button class="sec" data-c="${o.id}">Copiar código Pix</button><button class="pri" data-p="${o.id}"${told[o.id]?' disabled':''}>${told[o.id]?'Aviso enviado. Aguarde a confirmação':'Já paguei'}</button>`:'<div class="mut">A loja ainda não cadastrou a chave Pix. Fale com a loja.</div>'):'<div class="mut">Pagamento confirmado pela loja.</div>')+'</div>').join('')||'<p class="mut">Nenhum pedido em andamento.</p>';
  $('#nt').hidden=!(window.Notification&&Notification.permission==='default');
}
function ready(o){
  msg('Seu pedido está pronto! Pode retirar.');if(navigator.vibrate)navigator.vibrate([300,150,300]);
  if(window.Notification&&Notification.permission==='granted'){
    const t='Seu pedido está pronto!',op={body:'Pode retirar o pedido de '+R(o.total)+'.',icon:'icon-192.png'};
    (navigator.serviceWorker?navigator.serviceWorker.ready.then(r=>r.showNotification(t,op)):Promise.reject()).catch(()=>{try{new Notification(t,op)}catch(e){}});
  }
}
async function order(){
  if(!cups.length)return;
  if(!aberta(cfg)){msg('A loja não está recebendo pedidos agora.');return}
  if(!cfg.pix){msg('A loja ainda não cadastrou a chave Pix. Fale com a loja.');return}
  const multi=cups.length>1,items=[];
  cups.forEach((c,k)=>{const s=multi?' (copo '+(k+1)+')':'',b=P(c.b);items.push({p:b.id,n:b.name+s,q:1,pr:b.price});c.i.forEach(id=>{const g=P(id);items.push({p:id,n:'+ '+g.name+s,q:1,pr:g.price})})});
  const total=Math.round(items.reduce((s,i)=>s+i.pr,0)*100)/100;
  const ref=await addDoc(collection(db,'orders'),{uid:me.uid,name,items,total,pay:'pix',st:'novo',paid:false,t:Date.now()});
  ntfy('Novo pedido de açaí','O cliente '+name+' fez um pedido de '+R(total)+'. Abra o app para ver.');
  let ok=false;try{await navigator.clipboard.writeText(pixCode({id:ref.id,total}));ok=true}catch(e){}
  cups=[];base=null;pick=new Set();render();
  msg(ok?'Pedido enviado! Código Pix copiado: cole no app do banco.':'Pedido enviado! Copie o código Pix abaixo.');
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  try{
    if(b.dataset.b){base=b.dataset.b;pick=new Set();render()}
    else if(b.id==='addc'){
      const c={b:base,i:[...pick]},u={};[...cups,c].forEach(x=>[x.b,...x.i].forEach(id=>u[id]=(u[id]||0)+1));
      const bad=Object.keys(u).find(id=>!P(id)||u[id]>P(id).qty);
      if(bad){msg('Sem estoque suficiente de '+(P(bad)?P(bad).name:'um item')+'.');return}
      cups.push(c);base=null;pick=new Set();render();msg('Açaí adicionado ao pedido.')}
    else if(b.dataset.r){cups.splice(+b.dataset.r,1);render()}
    else if(b.id==='go')await order();
    else if(b.dataset.c){const o=orders.find(x=>x.id===b.dataset.c);try{await navigator.clipboard.writeText(pixCode(o));msg('Código copiado. No app do banco, escolha Pix Copia e Cola.')}catch(x){msg('Segure o dedo no código e toque em Copiar.')}}
    else if(b.dataset.p){const o=orders.find(x=>x.id===b.dataset.p);if(!o)return;
      ntfy('Cliente avisou o Pix','O cliente '+o.name+' informou que pagou '+R(o.total)+'. Confira o Pix no banco e toque em Pix recebido.');
      told[o.id]=1;try{localStorage.setItem('told',JSON.stringify(told))}catch(x){}render();msg('Aviso enviado à loja. Ela confirma assim que o Pix chegar.')}
    else if(b.id==='nt'){await Notification.requestPermission();render()}
  }catch(er){erro(er)}
});
document.addEventListener('change',e=>{const i=e.target.dataset.i;if(!i)return;if(e.target.checked)pick.add(i);else pick.delete(i)});
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];me=u;prev=null;orders=[];cups=[];base=null;pick=new Set();
  $('#out').hidden=!!u;$('#app').hidden=!u;if(!u)return;
  name=u.displayName||'Cliente';
  try{const c=await getDoc(doc(db,'customers',u.uid));if(c.exists()&&c.data().name)name=c.data().name}catch(e){}
  unsubs=[
    onSnapshot(collection(db,'products'),s=>{prods=s.docs.map(d=>({id:d.id,...d.data()}));render()},erro),
    onSnapshot(doc(db,'config','loja'),s=>{cfg=s.data()||{};render()},erro),
    onSnapshot(query(collection(db,'orders'),where('uid','==',u.uid)),s=>{
      const l=s.docs.map(d=>({id:d.id,...d.data()}));
      if(prev)l.forEach(o=>{const a=prev[o.id];if(!a)return;if(o.st==='pronto'&&a.st!=='pronto')ready(o);else if(o.paid&&!a.paid)msg('Pagamento confirmado pela loja!')});
      prev={};l.forEach(o=>prev[o.id]={st:o.st,paid:!!o.paid});orders=l;render()},erro)
  ];
});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
