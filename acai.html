<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest-loja.webmanifest">
<title>Monte seu açaí</title>
<style>
:root{--bg:#fff0e3;--card:#fff;--ink:#2e1708;--mut:#7a5236;--line:#9a3412;--acc:#d9480f;--acci:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1c0f08;--card:#2b1810;--ink:#ffe8d6;--mut:#d9b8a0;--line:#c2410c;--acc:#ff8a3d;--acci:#2a1204;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
h1{margin:6px 0 2px;font-size:28px;line-height:1.1}
h2{margin:20px 0 4px;font-size:18px}
a{color:var(--ink);font-weight:800}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:13px;font-weight:600}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri,.sec{width:100%;margin-top:10px;border-radius:12px;padding:12px;font-weight:800;border:2px solid var(--line)}
.pri{background:var(--acc);color:var(--acci);border-color:var(--acc)}
.sec{background:var(--card)}
button:disabled{opacity:.4;cursor:not-allowed}
.base{display:flex;justify-content:space-between;gap:10px;width:100%;margin-top:8px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-weight:800}
.base[aria-pressed="true"]{background:var(--acc);color:var(--acci);border-color:var(--acc)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line);font-weight:700}
.opt.off{opacity:.45}
.opt input{width:24px;height:24px;flex:none}
.cup{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.del{background:none;border:0;color:var(--acc);font-weight:800;padding:4px 0}
.pill{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:800;background:#ffe38a;color:#5a4000}
.pill.pronto{background:#c5ecd3;color:#0f5a33}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
textarea{width:100%;margin-top:8px;font:12px/1.3 ui-monospace,Menlo,monospace;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;resize:none}
.cod{margin:6px 0;font-weight:800;font-size:14px}.cod b{display:inline-block;margin-left:6px;padding:2px 12px;border-radius:10px;background:var(--ink);color:var(--bg);font:800 22px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.12em}
main{padding-bottom:110px}
#bases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.base{margin-top:0;flex-direction:column;gap:2px;align-items:flex-start}
.chips2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.chip{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;cursor:pointer;transition:transform .12s,background .15s}
.chip:active{transform:scale(.97)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{background:var(--acc);color:var(--acci);border-color:var(--acc)}
.chip.on .mut{color:var(--acci);opacity:.85}
.chip.off{opacity:.45}
.base{padding:0 0 10px;overflow:hidden;align-items:stretch}
.base>span{padding:0 12px}
.bi{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:rgba(0,0,0,.06);border-bottom:2px solid var(--line);margin-bottom:6px}
.bi.ph{display:flex;align-items:center;justify-content:center;font:400 44px Georgia,serif;opacity:.35;padding:0!important}
.base:disabled .bi{filter:grayscale(1)}
.chip.hasimg{display:grid;grid-template-columns:42px 1fr;column-gap:10px;row-gap:0;align-items:center}
.chip .ci{grid-row:1/3;width:42px;height:42px;border-radius:10px;object-fit:cover;background:rgba(0,0,0,.06)}
#scrim{position:fixed;inset:0;background:rgba(10,20,45,.55);z-index:18}
#ingw,#cartw{position:fixed;left:0;right:0;bottom:0;z-index:19;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;border-bottom:0;max-height:88vh;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:sheetUp .28s ease both}
#ingw{overflow:hidden}#ingw:not([hidden]){display:flex;flex-direction:column}
#cartw{overflow:auto}
#ingb{overflow:auto;flex:1;min-height:0;padding-bottom:6px}
.shf{padding-top:6px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:18px}
.x{background:var(--bg);border:0;border-radius:50%;width:36px;height:36px;font-size:22px;line-height:1;color:var(--ink)}
#go{position:sticky;bottom:0}
#bar2{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;max-width:536px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--acc);color:var(--acci);border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:15px;box-shadow:0 8px 22px rgba(0,0,0,.25);animation:sheetUp .3s ease both}
#bar2 .go{background:var(--acci);color:var(--acc);border-radius:10px;padding:7px 14px}
@keyframes sheetUp{from{opacity:0;transform:translateY(24px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#msg:not(:empty){position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:9;max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<main>
<a href="loja.html">Voltar à loja</a>
<h1>Monte seu açaí</h1>
<div id="msg" role="status"></div>
<div id="out" class="card" hidden>Entre na sua conta pela <a href="loja.html">loja</a> e volte aqui para montar o açaí.</div>
<div id="app" hidden>
<div id="favw" class="card" hidden></div>
<h2>Escolha o açaí</h2>
<div id="bases"></div>
<div id="ingw" class="card" hidden>
<div class="sh"><img id="shimg" alt="" hidden style="width:50px;height:50px;border-radius:12px;object-fit:cover;flex:none"><b id="shname" style="flex:1"></b><button class="x" id="shx" type="button" aria-label="Fechar">×</button></div>
<div id="ingb"><b>Escolha os ingredientes</b><div id="ings" class="chips2"></div><b id="cth" style="display:block;margin-top:14px" hidden>Escolha a cobertura</b><div id="cobs" class="chips2"></div></div>
<div class="shf"><label style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px"><input type="checkbox" id="favck" style="width:20px;height:20px"> Salvar como meu açaí de sempre</label><button class="pri" id="addc" type="button">Adicionar ao pedido</button></div>
</div>
<div id="cartw" class="card" hidden><div class="sh"><b>Seu pedido</b><button class="x" id="cartx" type="button" aria-label="Fechar">×</button></div><div id="cups"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="cup2" placeholder="Cupom de desconto" autocomplete="off" autocapitalize="characters" style="flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card);color:var(--ink);font:inherit"><button id="cupb2" class="sec" type="button" style="width:auto;margin-top:0;padding:0 16px">Aplicar</button></div><select id="ret2" style="width:100%;margin-top:8px;border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card);color:var(--ink);font:inherit"><option value="">Retirada: o quanto antes</option><option value="Em 15 minutos">Em 15 minutos</option><option value="Em 30 minutos">Em 30 minutos</option><option value="Em 1 hora">Em 1 hora</option><option value="agendar">Agendar para outro dia ou horário…</option></select><input id="retdt2" type="datetime-local" hidden style="width:100%;margin-top:8px;border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card);color:var(--ink);font:inherit"><input id="obs2" maxlength="140" placeholder="Observação (opcional): sem granola, calda à parte" autocomplete="off" style="width:100%;margin-top:8px;border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card);color:var(--ink);font:inherit"><button class="pri" id="go"></button><div class="mut" style="margin-top:8px">O pagamento é por Pix. O código aparece logo depois de enviar o pedido.</div></div>
<h2>Pedidos em andamento</h2>
<div id="orders"></div>
<button class="sec" id="nt" hidden>Ativar avisos neste celular</button>
</div>
</main>
<div id="scrim" hidden></div>
<button id="bar2" type="button" hidden><span id="b2n"></span><b id="b2t"></b><span class="go">Finalizar</span></button>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,addDoc,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAR7RtHesHauHTugXU6YMHA1j3dpVrxXYw",authDomain:"loja-andrea.firebaseapp.com",projectId:"loja-andrea",storageBucket:"loja-andrea.firebasestorage.app",messagingSenderId:"174611699950",appId:"1:174611699950:web:a7d93ea5e8d0e4effa3bff"});
const auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const ST={novo:'Aguardando a loja',sep:'Em preparo',pronto:'Pronto para retirar'};
let cartOpen=false,me=null,name='Cliente',cfg={},prods=[],orders=[],cups=[],base=null,pick=new Set(),prev=null,unsubs=[],told={};
try{told=JSON.parse(localStorage.getItem('told')||'{}')}catch(e){}
const P=id=>prods.find(p=>p.id===id),bases=()=>prods.filter(p=>nz(p.cat)==='acai'),ings=()=>prods.filter(p=>nz(p.cat)==='ingredientes').sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
const cobs=()=>prods.filter(p=>/^cobertura/.test(nz(p.cat))).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
function storeItems(){
  if(parent===window)return [];
  try{return [...parent.document.querySelectorAll('#citems .ci')].map(r=>{
    const b=r.querySelector('button[data-id]'),id=b&&b.dataset.id,q=+((r.querySelector('.step b')||{}).textContent),p=P(id);
    return p&&q>0?{p:id,n:p.name,q,pr:p.price}:null}).filter(Boolean)}catch(e){return []}
}
function clearStore(items){
  try{const d=parent.document,b=d.createElement('button');b.dataset.a='cm';b.hidden=true;d.body.appendChild(b);
    items.forEach(i=>{b.dataset.id=i.p;for(let k=0;k<i.q;k++)b.click()});b.remove()}catch(e){}
}
const retInfo=()=>{let v=$('#ret2').value,d=$('#retdt2').value;if(!v){try{v=parent.document.getElementById('ret').value;d=parent.document.getElementById('retdt').value}catch(e){}}if(v!=='agendar')return {txt:v||'',ts:0};if(!d)return {err:'Escolha o dia e a hora do agendamento.'};const t=Date.parse(d);if(!(t>Date.now()+10*60000))return {err:'Escolha um horário daqui a pelo menos 10 minutos.'};if(t>Date.now()+7*864e5)return {err:'Agende com até 7 dias de antecedência.'};return {txt:'Agendado para '+new Date(t).toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),ts:t}};
const FK=()=>'fav_'+(me?me.uid:'x');
const getFav=()=>{try{return JSON.parse(localStorage.getItem(FK())||'null')}catch(e){return null}};
const setFav=f=>{try{f?localStorage.setItem(FK(),JSON.stringify(f)):localStorage.removeItem(FK())}catch(e){}};
const cupDesc=t=>{try{const c=parent.__cupom;if(!c)return 0;return Math.min(t,Math.round((c.pct?t*c.pct/100:c.val)*100)/100)}catch(e){return 0}};
const cupCode=d=>{try{return d>0&&parent.__cupom?parent.__cupom.code:''}catch(e){return ''}};
function goPed(){try{const t=parent.document.querySelector('#tabs button[data-v="ped"]');if(t)t.click()}catch(e){}}
const cupTot=c=>(P(c.b)?P(c.b).price:0)+c.i.reduce((s,id)=>s+(P(id)?P(id).price:0),0);
function msg(t){let m=$('#msg');try{if(parent!==window){const pm=parent.document.getElementById('msg');if(pm)m=pm}}catch(e){}m.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent='',6000)}
const erro=e=>msg(e.code==='permission-denied'?'Sem permissão para essa ação.':'Erro: '+(e.code||e.message));
const asc=(s,n)=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().slice(0,n);
const tl=(i,v)=>i+String(v.length).padStart(2,'0')+v;
function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const cpfOk=d=>{if(d.length!==11||/^(\d)\1+$/.test(d))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=d[i]*(t+1-i);if((s*10%11)%10!=d[t])return false}return true};
function pixKey(k){
  k=String(k||'').trim();if(k.includes('@'))return k.toLowerCase();
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k))return k.toLowerCase();
  const d=k.replace(/\D/g,'');
  if(k[0]==='+')return '+'+d;
  if(d.length===13&&d.startsWith('55'))return '+'+d;
  if(d.length===11)return cpfOk(d)?d:'+55'+d;
  if(d.length===10)return '+55'+d;
  return d.length>=11&&/^[\d.\/-]+$/.test(k)?d:k;
}
function pixCode(o){
  const p='000201010211'+tl('26',tl('00','br.gov.bcb.pix')+tl('01',pixKey(cfg.pix)))+'52040000'+'5303986'+tl('54',(+o.total).toFixed(2))+'5802BR'+tl('59',asc(cfg.nome||'LOJA',25))+tl('60',asc(cfg.cidade||'BRASIL',15))+tl('62',tl('05',String(o.id).replace(/[^A-Za-z0-9]/g,'').slice(0,20)||'***'))+'6304';
  return p+crc(p);
}
const hm=()=>{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()),g=t=>+p.find(x=>x.type===t).value;return (g('hour')%24)*60+g('minute')};
const mins=s=>{const [h,m]=String(s||'0:0').split(':');return +h*60+(+m||0)};
const aberta=c=>{if(c.open===false)return false;try{if((parent.__lotado||0)>Date.now())return false}catch(e){}if(!c.auto)return true;const n=hm(),a=mins(c.from||'07:00'),f=mins(c.to||'23:00');return a<=f?(n>=a&&n<f):(n>=a||n<f)};
const ntfy=(t,m)=>{if(cfg.ntfy)fetch('https://ntfy.sh/'+encodeURIComponent(cfg.ntfy)+'/publish?title='+encodeURIComponent(t)+'&priority=high&tags=shopping_cart&message='+encodeURIComponent(m),{mode:'no-cors'}).catch(()=>{})};
function render(){
  const B=bases(),I=ings(),C=cobs();
  $('#bases').innerHTML=B.length?B.map(p=>`<button class="base" data-b="${p.id}" aria-pressed="${base===p.id}"${p.qty<=0?' disabled':''}>${p.img?`<img class="bi" src="${p.img}" alt="">`:`<span class="bi ph">${esc(p.name.slice(0,1).toUpperCase())}</span>`}<span>${esc(p.name)}</span><span>${p.qty<=0?'Esgotado':R(p.price)}</span></button>`).join(''):'<p class="mut">Os açaís ainda não foram cadastrados na loja.</p>';
  {const f=getFav(),w=$('#favw');
    if(f&&P(f.b)){const nomes=f.i.map(id=>P(id)?P(id).name:null).filter(Boolean);w.hidden=false;
      w.innerHTML=`<div class="mut">Meu açaí de sempre</div><b>${esc(P(f.b).name)}</b><div class="mut">${nomes.length?nomes.map(esc).join(', '):'Sem ingredientes'}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="pri" id="favadd" type="button" style="flex:1;margin-top:0">Pedir agora · ${R(cupTot({b:f.b,i:f.i.filter(id=>P(id))}))}</button><button class="sec" id="favrm" type="button" style="width:auto;margin-top:0;padding:0 16px">Remover</button></div>`}
    else w.hidden=true}
  $('#ingw').hidden=!base;if(base&&P(base)){$('#shname').textContent=P(base).name+' · '+R(P(base).price);{const im=$('#shimg');if(P(base).img){im.src=P(base).img;im.hidden=false}else{im.hidden=true}}$('#addc').textContent='Adicionar ao pedido · '+R(cupTot({b:base,i:[...pick]}))}
  const opt=p=>`<label class="chip${pick.has(p.id)?' on':''}${p.qty<=0?' off':''}${p.img?' hasimg':''}">${p.img?`<img class="ci" src="${p.img}" alt="">`:''}<input type="checkbox" data-i="${p.id}"${pick.has(p.id)?' checked':''}${p.qty<=0?' disabled':''}><span>${esc(p.name)}</span><span class="mut">${p.qty<=0?'Esgotado':p.price>0?'Mais '+R(p.price):'Sem custo'}</span></label>`;
  $('#ings').innerHTML=I.map(opt).join('')||'<p class="mut">Nenhum ingrediente cadastrado ainda.</p>';
  $('#cobs').innerHTML=C.map(opt).join('');$('#cth').hidden=!C.length;
  const store=cups.length?storeItems():[],tot=cups.reduce((s,c)=>s+cupTot(c),0)+store.reduce((s,i)=>s+i.pr*i.q,0);
  if(!cups.length)cartOpen=false;
  $('#cartw').hidden=!(cups.length&&cartOpen);$('#scrim').hidden=!(base||(cups.length&&cartOpen));
  $('#bar2').hidden=!(cups.length&&!base&&!cartOpen);$('#b2n').textContent=cups.length+(cups.length==1?' açaí':' açaís');
  $('#cups').innerHTML=cups.map((c,k)=>`<div class="cup"><span><b>${esc(P(c.b)?P(c.b).name:'Açaí')}</b><br><span class="mut">${c.i.map(id=>esc(P(id)?P(id).name:'')).join(', ')||'Sem ingredientes'}</span></span><span><b>${R(cupTot(c))}</b><br><button class="del" data-r="${k}">Remover</button></span></div>`).join('')+store.map(i=>`<div class="cup"><span>${i.q}x ${esc(i.n)}<br><span class="mut">Item da loja</span></span><b>${R(i.pr*i.q)}</b></div>`).join('');
  const dsc0=cups.length?cupDesc(tot):0;$('#go').textContent='Fazer pedido: '+R(tot-dsc0)+(dsc0>0?' (cupom aplicado)':'');$('#b2t').textContent=R(tot-dsc0);
  const isA=i=>{const p=P(i.p),c=p?nz(p.cat):'';return c==='acai'||c==='ingredientes'||c.indexOf('cobertura')===0};
  const ac=orders.filter(o=>ST[o.st]&&(o.items||[]).some(isA)).sort((a,b)=>b.t-a.t);
  $('#orders').innerHTML=ac.map(o=>`<div class="card"><div class="rh"><span class="pill ${o.st}">${ST[o.st]}</span><b>${R(o.total)}</b></div>${o.code&&['novo','sep','pronto'].includes(o.st)?`<div class="cod">Código de retirada <b>${o.code}</b></div>`:''}<div class="mut">${(o.items||[]).map(i=>`${i.q}x ${esc(i.n)}`).join(', ')}</div>`
    +(o.pay==='pix'&&!o.paid?(cfg.pix?`<div class="mut" style="margin-top:8px">Pague ${R(o.total)} por Pix: copie o código e cole no app do banco, em Pix Copia e Cola.</div><textarea readonly rows="4" onfocus="this.select()">${pixCode(o)}</textarea><button class="sec" data-c="${o.id}">Copiar código Pix</button><button class="pri" data-p="${o.id}"${told[o.id]?' disabled':''}>${told[o.id]?'Aviso enviado. Aguarde a confirmação':'Já paguei'}</button>`:'<div class="mut">A loja ainda não cadastrou a chave Pix. Fale com a loja.</div>'):'<div class="mut">Pagamento confirmado pela loja.</div>')+'</div>').join('')||'<p class="mut">Nenhum pedido em andamento.</p>';
  $('#nt').hidden=!(window.Notification&&Notification.permission==='default');
}
function ready(o){
  msg('Seu pedido está pronto! Pode retirar.');if(navigator.vibrate)navigator.vibrate([300,150,300]);
  if(window.Notification&&Notification.permission==='granted'){
    const t='Seu pedido está pronto!',op={body:'Pode retirar o pedido de '+R(o.total)+'.',icon:'icon-192.png'};
    (navigator.serviceWorker?navigator.serviceWorker.ready.then(r=>r.showNotification(t,op)):Promise.reject()).catch(()=>{try{new Notification(t,op)}catch(e){}});
  }
}
async function order(fromParent){
  if(!cups.length)return;
  if(!aberta(cfg)){msg('A loja não está recebendo pedidos agora.');return}
  if(!cfg.pix){msg('A loja ainda não cadastrou a chave Pix. Fale com a loja.');return}
  if(fromParent){try{const pv=parent.document.getElementById('pay');if(pv&&pv.value!=='pix'){msg('Pedidos com açaí são pagos por Pix. Escolha Pix na forma de pagamento.');return}}catch(e){}}
  const store=storeItems(),multi=cups.length>1,items=[];
  cups.forEach((c,k)=>{const s=multi?' (copo '+(k+1)+')':'',b=P(c.b);items.push({p:b.id,n:b.name+s,q:1,pr:b.price});c.i.forEach(id=>{const g=P(id);items.push({p:id,n:'+ '+g.name+s,q:1,pr:g.price})})});
  store.forEach(i=>items.push(i));
  const total0=Math.round(items.reduce((s,i)=>s+i.pr*i.q,0)*100)/100,dsc=cupDesc(total0),total=Math.round((total0-dsc)*100)/100,cp=cupCode(dsc);
  const code=String(100+crypto.getRandomValues(new Uint32Array(1))[0]%900),obs=(($('#obs2').value||'').trim()||(()=>{try{return parent.document.getElementById('obs').value.trim()}catch(e){return ''}})()).slice(0,140),ri=retInfo();
  if(ri.err){msg(ri.err);return}
  const ret=ri.txt;
  const ref=await addDoc(collection(db,'orders'),{uid:me.uid,name,items,total,pay:'pix',st:'novo',paid:false,code,obs,ret,agenda:ri.ts,cupom:cp,desc:dsc,t:Date.now()});
  ntfy('Novo pedido de açaí','O cliente '+name+' fez um pedido de '+R(total)+'. Abra o app para ver.');
  let ok=false;try{await navigator.clipboard.writeText(pixCode({id:ref.id,total}));ok=true}catch(e){}
  cups=[];base=null;pick=new Set();clearStore(store);$('#obs2').value='';$('#ret2').value='';$('#retdt2').value='';$('#retdt2').hidden=true;$('#cup2').value='';try{parent.document.getElementById('obs').value='';parent.document.getElementById('ret').value='';parent.document.getElementById('retdt').value='';parent.document.getElementById('retdt').hidden=true;parent.document.getElementById('cupom').value='';parent.__cupom=null}catch(e){}render();if(fromParent)goPed();
  msg((ok?'Pedido enviado! Código Pix copiado: cole no app do banco. ':'Pedido enviado! Copie o código Pix abaixo. ')+'Seu código de retirada: '+code+'. Guarde-o.');
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  try{
    if(b.dataset.b){base=b.dataset.b;pick=new Set();render()}
    else if(b.id==='addc'){
      const c={b:base,i:[...pick]},u={};[...cups,c].forEach(x=>[x.b,...x.i].forEach(id=>u[id]=(u[id]||0)+1));
      storeItems().forEach(i=>u[i.p]=(u[i.p]||0)+i.q);
      const bad=Object.keys(u).find(id=>!P(id)||u[id]>P(id).qty);
      if(bad){msg('Sem estoque suficiente de '+(P(bad)?P(bad).name:'um item')+'.');return}
      const sv=$('#favck').checked;cups.push(c);if(sv)setFav({b:c.b,i:c.i});$('#favck').checked=false;base=null;pick=new Set();render();msg('Açaí adicionado ao pedido.'+(sv?' Salvo como meu açaí de sempre.':''))}
    else if(b.dataset.r){cups.splice(+b.dataset.r,1);render()}
    else if(b.id==='favadd'){
      const f=getFav();if(!f)return;
      if(!P(f.b)||P(f.b).qty<=0){msg('Esse açaí não está disponível agora.');return}
      const ing=f.i.filter(id=>P(id)&&P(id).qty>0),lost=f.i.length-ing.length,c={b:f.b,i:ing},u={};
      [...cups,c].forEach(x=>[x.b,...x.i].forEach(id=>u[id]=(u[id]||0)+1));storeItems().forEach(i=>u[i.p]=(u[i.p]||0)+i.q);
      const bad=Object.keys(u).find(id=>!P(id)||u[id]>P(id).qty);
      if(bad){msg('Sem estoque suficiente de '+(P(bad)?P(bad).name:'um item')+'.');return}
      cups.push(c);render();msg('Açaí adicionado ao pedido.'+(lost?' '+lost+(lost==1?' item sem estoque ficou de fora.':' itens sem estoque ficaram de fora.'):''))}
    else if(b.id==='favrm'){setFav(null);render();msg('Favorito removido.')}
    else if(b.id==='shx'){base=null;pick=new Set();render()}
    else if(b.id==='cartx'){cartOpen=false;render()}
    else if(b.id==='bar2'){cartOpen=true;render()}
    else if(b.id==='cupb2'){const r=await parent.__aplicarCupom($('#cup2').value);msg(r.msg);render()}
    else if(b.id==='go')await order();
    else if(b.dataset.c){const o=orders.find(x=>x.id===b.dataset.c);try{await navigator.clipboard.writeText(pixCode(o));msg('Código copiado. No app do banco, escolha Pix Copia e Cola.')}catch(x){msg('Segure o dedo no código e toque em Copiar.')}}
    else if(b.dataset.p){const o=orders.find(x=>x.id===b.dataset.p);if(!o)return;
      ntfy('Cliente avisou o Pix','O cliente '+o.name+' informou que pagou '+R(o.total)+'. Confira o Pix no banco e toque em Pix recebido.');
      told[o.id]=1;try{localStorage.setItem('told',JSON.stringify(told))}catch(x){}render();msg('Aviso enviado à loja. Ela confirma assim que o Pix chegar.')}
    else if(b.id==='nt'){await Notification.requestPermission();render()}
  }catch(er){erro(er)}
});
document.addEventListener('change',e=>{const i=e.target.dataset.i;if(!i)return;if(e.target.checked)pick.add(i);else pick.delete(i);const ch=e.target.closest('.chip');if(ch)ch.classList.toggle('on',e.target.checked);if(base&&P(base))$('#addc').textContent='Adicionar ao pedido · '+R(cupTot({b:base,i:[...pick]}))});
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];me=u;prev=null;orders=[];cups=[];base=null;pick=new Set();
  $('#out').hidden=!!u;$('#app').hidden=!u;if(!u)return;
  name=u.displayName||'Cliente';
  try{const c=await getDoc(doc(db,'customers',u.uid));if(c.exists()&&c.data().name)name=c.data().name}catch(e){}
  unsubs=[
    onSnapshot(collection(db,'products'),s=>{prods=s.docs.map(d=>({id:d.id,...d.data()}));render()},erro),
    onSnapshot(doc(db,'config','loja'),s=>{cfg=s.data()||{};render()},erro),
    onSnapshot(query(collection(db,'orders'),where('uid','==',u.uid)),s=>{
      const l=s.docs.map(d=>({id:d.id,...d.data()}));
      if(prev)l.forEach(o=>{const a=prev[o.id];if(!a)return;if(o.st==='pronto'&&a.st!=='pronto')ready(o);else if(o.paid&&!a.paid)msg('Pagamento confirmado pela loja!')});
      prev={};l.forEach(o=>prev[o.id]={st:o.st,paid:!!o.paid});orders=l;render()},erro)
  ];
});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('click',e=>{if(e.target.id==='scrim'){base=null;pick=new Set();cartOpen=false;render()}});
document.addEventListener('change',e=>{if(e.target.id==='ret2'){const d=$('#retdt2');d.hidden=e.target.value!=='agendar';const m=new Date(Date.now()+10*60000-new Date().getTimezoneOffset()*60000);d.min=m.toISOString().slice(0,16)}});
window.acaiClear=()=>{cups=[];base=null;pick=new Set();cartOpen=false;render()};
window.acaiCupsCount=()=>cups.length;
window.acaiInfo=()=>({n:cups.length,total:cups.reduce((s,c)=>s+cupTot(c),0)});
window.acaiOrder=()=>order(true).catch(erro);
let sig='';setInterval(()=>{const s=JSON.stringify(storeItems())+((()=>{try{return (parent.__cupom||{}).code}catch(e){return ''}})()||'');if(s!==sig){sig=s;render()}},700);
render();
</script>
