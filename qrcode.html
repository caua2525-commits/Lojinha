<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code da loja</title>
<style>
:root{--ink:#2e1708;--bg:#e8590c;--acc:#9a3412;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
.poster{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:28px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 14px 34px rgba(16,41,90,.25)}
h1{margin:0 0 4px;font-size:30px;line-height:1.1;font-weight:900}
.sub{margin:0 0 18px;font-weight:700}
#qr{display:flex;justify-content:center;padding:14px;background:#fff;border:3px solid var(--ink);border-radius:18px;margin:0 auto;width:fit-content}
#qr img,#qr canvas{display:block;max-width:100%;height:auto}
.url{margin:16px 0 4px;font-size:12px;word-break:break-all;opacity:.7}
.tag{display:inline-block;margin-top:10px;background:var(--acc);color:#fff;border-radius:99px;padding:6px 16px;font-weight:800}
button{margin-top:18px;width:100%;border:0;border-radius:14px;padding:13px;background:var(--ink);color:#fff;font:inherit;font-weight:800;cursor:pointer}
@media print{body{background:#fff;padding:0}.poster{box-shadow:none;max-width:none}button{display:none}}
</style>
</head>
<body>
<div class="poster">
<h1>Peça pelo celular</h1>
<p class="sub">Aponte a câmera para o QR Code e faça seu pedido</p>
<div id="qr"></div>
<div class="url" id="url"></div>
<span class="tag">Açaí e muito mais</span>
<button onclick="window.print()">Imprimir</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var link=location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,'')+'loja.html';
document.getElementById('url').textContent=link;
try{new QRCode(document.getElementById('qr'),{text:link,width:240,height:240,colorDark:'#2e1708',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
catch(e){document.getElementById('qr').textContent='Não consegui gerar o QR Code. Confira a internet e abra de novo.'}
</script>
</body>
</html>
